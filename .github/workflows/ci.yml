name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time: no live Supabase in CI. Pages that need it fall back to demo.
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://ci.invalid"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # apps/mobile-driver is an Expo app with its own lockfile, not an npm
      # workspace, so the root `npm ci` never reaches it. Without these two steps
      # its suite is invisible to CI — which is how driver-link was changed under
      # a green build.
      - name: Mobile driver deps
        run: npm ci --prefix apps/mobile-driver

      - name: Mobile driver tests
        run: npm run test:mobile

      - name: Public env safety
        run: npm run security:env

      # supabase/migrations/ is a generated mirror of database/migrations/;
      # a parallel-branch merge can leave it stale (duplicate prefixes break
      # `supabase db reset`). Fail until someone re-runs db:local:sync.
      - name: Supabase migration mirror in sync
        run: npm run db:check-mirror

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCHEMA_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
      RLS_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
      LOAD_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 0001 -> latest builds a clean schema (tables / RLS / constraints / seeds)
      - name: Schema verify
        run: npm run db:verify-schema

      # per-persona read isolation + write-guard on the cookie-bound client
      - name: RLS matrix
        run: npm run db:verify-rls

      # 50 vehicles / 250 assignments / 10k pings — hot reads must stay index scans
      - name: Load scenario
        run: npm run db:load-scenario
